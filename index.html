<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Odak müziği</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { margin: 0; position: fixed; inset: 0; display: grid; place-items: center; color: #8a90b0; font: 14px system-ui, sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<script>
// A tiny YouTube player page for the "Çalışma Paneli" dashboard.
// The dashboard is opened as a local file, which YouTube refuses to play in
// (error 153: no referrer). Embedded from this real web address, the player
// works. Nothing is stored here; the video comes in the address:
//   ?v=VIDEO_ID  &list=PLAYLIST_ID  &start=SECONDS
(function () {
  var q = new URLSearchParams(location.search);
  var ok = function (s) { return s && /^[\w-]{6,64}$/.test(s) ? s : null; };
  var v = ok(q.get("v")), list = ok(q.get("list"));
  var start = /^\d{1,6}$/.test(q.get("start") || "") ? q.get("start") : "";
  if (!v && !list) {
    var p = document.createElement("p");
    p.textContent = "Çalışma Paneli için YouTube oynatıcısı.";
    document.body.appendChild(p);
    return;
  }
  var params = new URLSearchParams({ autoplay: "1", playsinline: "1", rel: "0", modestbranding: "1" });
  if (start) params.set("start", start);
  var path;
  if (v) {
    path = "embed/" + v;
    if (list) params.set("list", list);
    else { params.set("loop", "1"); params.set("playlist", v); }
  } else {
    path = "embed/videoseries";
    params.set("list", list);
  }
  var f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/" + path + "?" + params.toString();
  f.title = "YouTube";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.setAttribute("allowfullscreen", "");
  f.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(f);
})();
</script>
</body>
</html>
